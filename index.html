<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>CG VietDub — Single File</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   CG VietDub — theme lay cam hung tu son mai Viet Nam
   ============================================================ */
:root {
  --bg: #0e0b0a; --surface: #17130f; --surface-2: #1f1a15; --border: #2c2620;
  --red: #c1402f; --red-soft: #c1402f33; --gold: #d3a65a; --gold-soft: #d3a65a26;
  --teal: #4a9686; --text: #f3ebdf; --text-dim: #b3a696; --text-faint: #7d7266;
  --radius: 10px; --font-display: "Space Grotesk","Inter",sans-serif; --font-body: "Inter",sans-serif;
}
* { box-sizing: border-box; }
html,body,#root{ height:100%; }
body{ margin:0; background: radial-gradient(ellipse at top,#1a1410 0%,#0e0b0a 55%); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
.app-shell{ min-height:100%; display:flex; flex-direction:column; }
.app-header{ display:flex; align-items:baseline; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,#14100c 0%,#0e0b0a 100%); position:sticky; top:0; z-index:20; }
.brand{ display:flex; align-items:baseline; gap:6px; font-family:var(--font-display); }
.brand-mark{ color:var(--gold); font-weight:700; font-size:22px; letter-spacing:1px; }
.brand-name{ font-weight:600; font-size:22px; color:var(--text); }
.brand-tag{ color:var(--text-faint); font-size:13px; margin-left:auto; text-align:right; }
.app-main{ flex:1; display:grid; grid-template-columns:1fr; gap:20px; padding:16px; max-width:1200px; width:100%; margin:0 auto; }
@media (min-width:960px){ .app-main{ grid-template-columns:1.3fr 1fr; align-items:start; padding:24px; } }
.notice{ background:var(--gold-soft); border:1px solid var(--gold); color:var(--text); padding:10px 14px; border-radius:8px; font-size:12.5px; margin:12px 16px 0; line-height:1.5; }
.notice a{ color:var(--gold); }
.upload-zone{ border:1.5px dashed var(--border); border-radius:var(--radius); background:var(--surface); padding:48px 24px; text-align:center; cursor:pointer; transition:border-color .2s, background .2s; }
.upload-zone.is-dragover{ border-color:var(--gold); background:var(--gold-soft); }
.upload-icon{ font-size:32px; color:var(--gold); margin-bottom:8px; }
.upload-title{ font-family:var(--font-display); font-size:16px; margin:4px 0; }
.upload-sub{ color:var(--text-faint); font-size:13px; }
.upload-file-name{ font-weight:600; }
.upload-file-meta{ color:var(--text-faint); font-size:13px; margin-top:2px; }
.video-stage-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px; }
.video-stage{ position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; overflow:hidden; user-select:none; }
.video-el{ width:100%; height:100%; object-fit:contain; background:#000; }
.video-placeholder{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-faint); }
.cover-region{ position:absolute; border:1.5px solid var(--gold); cursor:move; display:flex; align-items:flex-start; justify-content:space-between; }
.cover-region-label{ font-size:10px; color:var(--gold); background:#0e0b0acc; padding:1px 5px; border-radius:3px; margin:3px; }
.cover-region-remove{ background:var(--red); color:#fff; border:none; width:18px; height:18px; border-radius:50%; font-size:10px; cursor:pointer; margin:3px; }
.cover-region-handle{ position:absolute; right:-4px; bottom:-4px; width:14px; height:14px; background:var(--gold); border-radius:3px; cursor:nwse-resize; }
.video-stage-actions{ display:flex; align-items:center; gap:12px; padding:10px 4px 2px; flex-wrap:wrap; }
.hint{ color:var(--text-faint); font-size:12px; }
.stepper{ margin:18px 4px 6px; }
.stepper-track{ position:relative; height:4px; background:var(--surface-2); border-radius:3px; margin:0 6px; }
.stepper-fill{ position:absolute; height:100%; background:linear-gradient(90deg,var(--red),var(--gold)); border-radius:3px; transition:width .3s; }
.stepper-node{ position:absolute; top:50%; width:9px; height:9px; border-radius:50%; background:var(--surface-2); border:2px solid var(--border); transform:translate(-50%,-50%); }
.stepper-node.is-active{ background:var(--gold); border-color:var(--gold); }
.stepper-node.is-failed{ background:var(--red); border-color:var(--red); }
.stepper-labels{ display:flex; justify-content:space-between; margin-top:8px; font-size:9.5px; color:var(--text-faint); }
.stepper-labels .is-active{ color:var(--gold); }
.stepper-progress{ text-align:right; font-size:12px; color:var(--text-dim); margin-top:4px; }
.tab-bar{ display:flex; overflow-x:auto; gap:6px; padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:12px; }
.tab-btn{ background:transparent; border:1px solid transparent; color:var(--text-faint); padding:8px 12px; border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap; font-family:var(--font-display); }
.tab-btn.is-active{ color:var(--bg); background:var(--gold); }
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.panel-header{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); }
.panel-header h3{ margin:0; font-family:var(--font-display); font-size:15px; }
.panel-count{ color:var(--text-faint); font-size:12px; }
.panel-body{ padding:14px; }
.panel-footnote{ padding:0 14px 14px; color:var(--text-faint); font-size:11px; margin:0; }
.segment-list{ max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.segment-row{ display:flex; flex-direction:column; gap:4px; background:var(--surface-2); padding:8px; border-radius:8px; }
.segment-time{ font-size:11px; color:var(--gold); font-family:var(--font-display); }
.segment-text{ background:transparent; border:none; color:var(--text); resize:vertical; font-family:var(--font-body); font-size:14px; width:100%; }
.segment-text:focus{ outline:1px solid var(--gold); }
.empty-hint{ color:var(--text-faint); font-size:13px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-grid label{ display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-dim); }
.form-grid select, .form-grid input[type=range], .form-grid input[type=text], .form-grid input[type=password]{ width:100%; }
.form-grid select, .form-grid input[type=text], .form-grid input[type=password]{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px; font-family:var(--font-body); }
.form-grid input[type=color]{ width:100%; height:32px; border:1px solid var(--border); border-radius:6px; background:var(--surface-2); }
.toggle{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); }
.btn{ font-family:var(--font-display); font-size:13px; border-radius:8px; padding:10px 16px; border:1px solid var(--border); cursor:pointer; background:var(--surface-2); color:var(--text); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn-primary{ background:linear-gradient(90deg,var(--red),#a8331f); border-color:transparent; color:#fff; }
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
.btn-ghost{ background:transparent; }
.btn-block{ width:100%; margin-top:10px; }
.btn-disabled{ pointer-events:none; opacity:.4; }
.action-row{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
.chip{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; }
.chip-active{ border-color:var(--gold); color:var(--gold); }
.export-modes{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
.export-sub-row{ display:flex; gap:8px; margin-top:8px; }
.export-sub-row .btn{ flex:1; }
.error-banner{ margin-top:12px; background:var(--red-soft); border:1px solid var(--red); color:#ffd7cf; padding:10px 12px; border-radius:8px; font-size:13px; white-space:pre-wrap; }
.log-box{ background:#0a0807; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:monospace; font-size:11px; color:var(--text-faint); max-height:120px; overflow-y:auto; margin-top:10px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="root" class="app-shell"></div>
<script type="module">
// ============================================================
// CG VietDub — ban gop 1 file HTML, chay hoan toan trong trinh
// duyet bang ffmpeg.wasm (khong can Node.js backend).
// STT / Dich / TTS deu dung GOOGLE GEMINI API.
//
// GIOI HAN THAT SU (khong gia vo la lam duoc het):
// - Video/audio duoc xu ly bang ffmpeg.wasm (WebAssembly) chay
//   ngay trong tab trinh duyet. Phu hop voi clip NGAN (vai phut,
//   duoi ~150-200MB). Clip dai/nang co the cham hoac het bo nho,
//   vi trinh duyet gioi han RAM cho WebAssembly.
// - STT / Dich / TTS goi THANG toi Gemini API (generativelanguage
//   .googleapis.com) tu trinh duyet bang API key ban nhap o tab
//   Settings. Key CHI luu trong bo nho JS (bien "state.apiKey"),
//   KHONG ghi vao localStorage — nhung vi day la ung dung
//   client-side, key se hien trong DevTools/Network cua chinh may
//   ban. Neu can bao mat key that su, hay dung ban backend (Node.js)
//   de giu key phia server.
// - Gemini KHONG phai la mo hinh STT chuyen dung (nhu Whisper): no
//   doc audio va TU SUY RA timestamp cho tung cau qua prompt. Do
//   chinh xac cua thoi gian bat dau/ket thuc co the kem hon Whisper
//   — nen ra soat lai transcript truoc khi dich/long tieng.
// - Gioi han request inline cua Gemini la 20MB (audio + prompt).
//   Voi audio dai hon, can dung Files API (khong lam trong ban
//   client-side thuan nay) hoac cat video ngan lai.
// - Phai mo file nay qua may chu tinh (http/https), KHONG mo truc
//   tiep bang duong dan file:// — vi trinh duyet chan ES module
//   va fetch tu CDN khi chay o file://. Vi du:
//     npx serve .          hoac
//     python3 -m http.server 8080
//   roi mo http://localhost:8080
// ============================================================

import { FFmpeg } from "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile, toBlobURL } from "https://unpkg.com/@ffmpeg/util@0.12.2/dist/esm/index.js";

const FFMPEG_CORE_BASE = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm";
// Font co day du dau tieng Viet, dung cho drawtext khi burn phu de.
// Neu link nay bi doi/404, thay bang bat ky URL .ttf cong khai nao khac.
const VIET_FONT_URL =
  "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSans/full/ttf/NotoSans-Regular.ttf";

const STEPS = [
  { key: "uploaded", label: "Uploading" },
  { key: "transcribing", label: "Transcribing" },
  { key: "translating", label: "Translating" },
  { key: "generating_voice", label: "Generating Voice" },
  { key: "processing_subtitle", label: "Processing Subtitle" },
  { key: "rendering", label: "Rendering" },
  { key: "completed", label: "Completed" },
];

const state = {
  ffmpeg: null,
  ffmpegReady: false,
  apiKey: "",
  textModel: "gemini-2.5-flash",
  ttsModel: "gemini-2.5-flash-preview-tts",
  file: null,
  videoUrl: null,
  inputName: null, // ten file da ghi vao FS ao cua ffmpeg
  duration: 0,
  width: 1280,
  height: 720,
  status: "uploaded",
  progress: 0,
  busy: false,
  error: null,
  log: [],
  transcript: [],
  translation: [],
  coverRegions: [],
  subtitleStyle: {
    font: "NotoSans",
    fontSize: 28,
    position: "bottom",
    color: "#FFFFFF",
    outline: "#000000",
    background: "on",
  },
  voiceSettings: { voice: "female", voiceNameFemale: "Kore", voiceNameMale: "Puck", speed: 1.0, mixVolume: 0.8 },
  showVietSub: true,
  showDub: false,
  activeTab: "transcript",
  hasDubAudio: false,
  finalBlobUrl: null,
  fontLoaded: false,
  dragging: null,
};

const root = document.getElementById("root");

// ---------------- utils ----------------
function fmtTime(t) {
  const m = Math.floor(t / 60);
  const s = (t % 60).toFixed(1);
  return `${String(m).padStart(2, "0")}:${String(s).padStart(4, "0")}`;
}
function fmtBytes(b) {
  if (!b) return "0 B";
  const u = ["B", "KB", "MB", "GB"];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return `${(b / Math.pow(1024, i)).toFixed(1)} ${u[i]}`;
}
function escapeDrawtext(text) {
  // Escape dung quy tac cua ffmpeg drawtext: \ : ' %
  return text
    .replace(/\\/g, "\\\\")
    .replace(/:/g, "\\:")
    .replace(/'/g, "\u2019") // doi nhay don thanh nhay cong de tranh loi parse
    .replace(/%/g, "\\%")
    .replace(/\n/g, "\\n");
}
function wrapText(text, maxChars = 42) {
  const words = text.split(/\s+/);
  const lines = [];
  let cur = "";
  for (const w of words) {
    if ((cur + " " + w).trim().length > maxChars) {
      if (cur) lines.push(cur.trim());
      cur = w;
    } else {
      cur = (cur + " " + w).trim();
    }
  }
  if (cur) lines.push(cur.trim());
  if (lines.length > 2) {
    const mid = Math.ceil(lines.length / 2);
    return [lines.slice(0, mid).join(" "), lines.slice(mid).join(" ")].join("\n");
  }
  return lines.join("\n");
}
function log(msg) {
  state.log.push(msg);
  if (state.log.length > 200) state.log.shift();
  renderLog();
}
function setError(msg) {
  state.error = msg;
  if (msg) log("LOI: " + msg);
  renderError();
}
function setStatus(status, progress) {
  state.status = status;
  if (progress !== undefined) state.progress = progress;
  renderStepper();
}

// ---------------- ffmpeg setup ----------------
async function ensureFFmpeg() {
  if (state.ffmpegReady) return state.ffmpeg;
  const ffmpeg = new FFmpeg();
  ffmpeg.on("log", ({ message }) => log(message));
  log("Dang tai FFmpeg engine (WebAssembly)... lan dau co the mat vai giay.");
  ffmpeg.on("progress", ({ progress }) => {
    if (state.status === "rendering") {
      const p = 90 + Math.min(9, Math.round((progress || 0) * 9));
      setStatus("rendering", p);
    }
  });
  await ffmpeg.load({
    coreURL: await toBlobURL(`${FFMPEG_CORE_BASE}/ffmpeg-core.js`, "text/javascript"),
    wasmURL: await toBlobURL(`${FFMPEG_CORE_BASE}/ffmpeg-core.wasm`, "application/wasm"),
  });
  state.ffmpeg = ffmpeg;
  state.ffmpegReady = true;
  log("FFmpeg engine da san sang.");
  return ffmpeg;
}

async function ensureFont() {
  if (state.fontLoaded) return;
  const ffmpeg = await ensureFFmpeg();
  log("Dang tai font tieng Viet cho phu de...");
  try {
    const fontData = await fetchFile(VIET_FONT_URL);
    await ffmpeg.writeFile("font.ttf", fontData);
    state.fontLoaded = true;
    log("Da tai font xong.");
  } catch (e) {
    throw new Error(
      "Khong tai duoc font tieng Viet de burn phu de (kiem tra ket noi mang / link font). " + e.message
    );
  }
}

// ---------------- pipeline steps ----------------
async function probeMeta(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.onloadedmetadata = () => {
      resolve({ duration: v.duration, width: v.videoWidth || 1280, height: v.videoHeight || 720 });
      URL.revokeObjectURL(v.src);
    };
    v.onerror = () => reject(new Error("Khong doc duoc metadata video. File co the bi loi hoac dinh dang khong ho tro."));
    v.src = URL.createObjectURL(file);
  });
}

async function handleFileSelected(file) {
  const ext = (file.name.split(".").pop() || "mp4").toLowerCase();
  const allowed = ["mp4", "mkv", "webm", "mov", "avi"];
  if (!allowed.includes(ext)) {
    setError(`Dinh dang khong ho tro: .${ext}. Chi ho tro ${allowed.join(", ")}`);
    return;
  }
  setError(null);
  state.file = file;
  state.videoUrl = URL.createObjectURL(file);
  state.inputName = "input." + ext;
  try {
    const meta = await probeMeta(file);
    state.duration = meta.duration;
    state.width = meta.width;
    state.height = meta.height;
  } catch (e) {
    setError(e.message);
    return;
  }
  setStatus("uploaded", 5);
  renderApp();

  // Ghi file vao he thong file ao cua ffmpeg.wasm de dung cho cac buoc sau
  try {
    const ffmpeg = await ensureFFmpeg();
    log("Dang ghi video vao bo nho xu ly (ffmpeg virtual FS)...");
    await ffmpeg.writeFile(state.inputName, await fetchFile(file));
    log("Da san sang de xu ly.");
  } catch (e) {
    setError("Khong the tai FFmpeg engine: " + e.message);
  }
}

async function extractAudio() {
  const ffmpeg = await ensureFFmpeg();
  await ffmpeg.exec(["-i", state.inputName, "-vn", "-ar", "16000", "-ac", "1", "audio.wav"]);
  const data = await ffmpeg.readFile("audio.wav");
  return new Blob([data.buffer], { type: "audio/wav" });
}

function requireApiKey() {
  if (!state.apiKey || state.apiKey.trim().length < 10) {
    throw new Error(
      "Chua nhap Gemini API key. Mo tab Settings va dan API key cua ban (chi luu tam trong bo nho trinh duyet, mat khi tai lai trang). Lay key tai aistudio.google.com/apikey."
    );
  }
}

function geminiUrl(model) {
  return `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(state.apiKey)}`;
}

async function blobToBase64(blob) {
  const buf = await blob.arrayBuffer();
  let binary = "";
  const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

async function callGemini(model, body) {
  const res = await fetch(geminiUrl(model), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Gemini API loi (${res.status}): ${await res.text()}`);
  return res.json();
}

// ---- STT: Gemini doc truc tiep file audio va TU SUY RA cau + timestamp
// qua prompt + structured output (responseSchema), khong phai model STT
// chuyen dung nhu Whisper nen do chinh xac ve thoi gian co the kem hon.
async function transcribeAudio(blob) {
  requireApiKey();
  const base64 = await blobToBase64(blob);
  const prompt =
    "Hay nghe doan audio nay va tach thanh cac cau/cum tu ngan tu nhien (giong cach chia dong phu de). " +
    "Voi moi cau, tra ve thoi gian bat dau (start) va ket thuc (end) tinh bang GIAY (so thap phan, tinh tu dau file audio), " +
    "va noi dung loi thoai goc (khong dich). Chi tra ve JSON, khong giai thich them.";
  const data = await callGemini(state.textModel, {
    contents: [
      {
        parts: [
          { inlineData: { mimeType: "audio/wav", data: base64 } },
          { text: prompt },
        ],
      },
    ],
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: {
        type: "ARRAY",
        items: {
          type: "OBJECT",
          properties: {
            start: { type: "NUMBER" },
            end: { type: "NUMBER" },
            text: { type: "STRING" },
          },
          required: ["start", "end", "text"],
        },
      },
    },
  });
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    throw new Error("Gemini tra ve JSON khong hop le cho transcript: " + e.message);
  }
  return parsed.map((s, idx) => ({ id: idx + 1, start: Number(s.start) || 0, end: Number(s.end) || 0, text: String(s.text || "").trim() }));
}

async function translateSegments(segments) {
  requireApiKey();
  const numbered = segments.map((s, i) => `${i + 1}. ${s.text}`).join("\n");
  const prompt =
    `Ban la bien dich vien chuyen nghiep. Hay dich cac cau sau tu ngon ngu goc sang tieng Viet tu nhien, giu dung van phong hoi thoai. ` +
    `Tra ve mot mang JSON cac chuoi (string), dung THU TU va SO LUONG voi danh sach goc, moi phan tu la ban dich cua 1 cau tuong ung, khong danh so, khong giai thich them.\n\n${numbered}`;
  const data = await callGemini(state.textModel, {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: { type: "ARRAY", items: { type: "STRING" } },
      temperature: 0.3,
    },
  });
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
  let lines;
  try {
    lines = JSON.parse(raw);
  } catch (e) {
    throw new Error("Gemini tra ve JSON khong hop le cho ban dich: " + e.message);
  }
  return segments.map((seg, idx) => ({
    id: seg.id,
    start: seg.start,
    end: seg.end,
    text: (lines[idx] || "").toString().trim() || seg.text,
  }));
}

// ---- TTS: Gemini tra ve audio PCM tho (16-bit, mono), khong phai file
// nen. Ta ghi thang PCM vao FS cua ffmpeg va khai bao dinh dang (-f s16le)
// khi doc lai, khong can tu dung WAV header.
async function synthesizeSegment(text, gender) {
  requireApiKey();
  const voiceName = gender === "male" ? state.voiceSettings.voiceNameMale : state.voiceSettings.voiceNameFemale;
  const data = await callGemini(state.ttsModel, {
    contents: [{ parts: [{ text }] }],
    generationConfig: {
      responseModalities: ["AUDIO"],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } },
    },
  });
  const part = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
  if (!part?.data) throw new Error("Gemini TTS khong tra ve audio. Kiem tra ten model/voice trong Settings.");
  const mimeType = part.mimeType || "";
  const rateMatch = mimeType.match(/rate=(\d+)/);
  const sampleRate = rateMatch ? Number(rateMatch[1]) : 24000;
  const binary = atob(part.data);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return { bytes, sampleRate };
}

async function generateVoiceTrack() {
  const ffmpeg = await ensureFFmpeg();
  const segFiles = [];
  for (const seg of state.translation) {
    if (!seg.text.trim()) continue;
    const { bytes, sampleRate } = await synthesizeSegment(seg.text, state.voiceSettings.voice);
    const fname = `tts_${seg.id}.pcm`;
    await ffmpeg.writeFile(fname, bytes);
    segFiles.push({ start: seg.start, fname, sampleRate });
  }
  if (segFiles.length === 0) throw new Error("Khong co cau nao de tao giong doc.");

  const speed = Math.min(2.0, Math.max(0.5, state.voiceSettings.speed));
  const args = [];
  segFiles.forEach((s) => {
    args.push("-f", "s16le", "-ar", String(s.sampleRate), "-ac", "1", "-i", s.fname);
  });
  const delayFilters = segFiles.map((s, i) => {
    const ms = Math.max(0, Math.round(s.start * 1000));
    return `[${i}:a]atempo=${speed},adelay=${ms}|${ms}[d${i}]`;
  });
  const mixInputs = segFiles.map((_, i) => `[d${i}]`).join("");
  const filterComplex = [
    ...delayFilters,
    `${mixInputs}amix=inputs=${segFiles.length}:duration=longest:dropout_transition=0[aout]`,
  ].join(";");
  args.push("-filter_complex", filterComplex, "-map", "[aout]", "-t", String(state.duration), "dub.wav");

  await ffmpeg.exec(args);
  state.hasDubAudio = true;
}

function buildVideoFilterChain(includeSubtitle) {
  const parts = [];
  state.coverRegions.forEach((r) => {
    const color = r.style === "blur" ? "black@0.55" : (r.color || "#000000").replace("#", "0x") + "@0.92";
    parts.push(`drawbox=x=${Math.round(r.x)}:y=${Math.round(r.y)}:w=${Math.round(r.w)}:h=${Math.round(r.h)}:color=${color}:t=fill`);
  });
  if (includeSubtitle) {
    const st = state.subtitleStyle;
    const yExpr = st.position === "top" ? "h*0.06" : st.position === "middle" ? "(h-text_h)/2" : "h-text_h-h*0.08";
    const box = st.background === "on" ? 1 : 0;
    state.translation.forEach((seg) => {
      if (!seg.text.trim()) return;
      const text = escapeDrawtext(wrapText(seg.text));
      parts.push(
        `drawtext=fontfile=font.ttf:text='${text}':fontcolor=${st.color}:fontsize=${st.fontSize}:` +
          `bordercolor=${st.outline}:borderw=2:box=${box}:boxcolor=black@0.4:boxborderw=8:` +
          `x=(w-text_w)/2:y=${yExpr}:enable='between(t,${seg.start},${seg.end})'`
      );
    });
  }
  return parts.join(",");
}

async function renderFinal(mode) {
  const ffmpeg = await ensureFFmpeg();
  const includeSubtitle = mode !== "dub";
  const includeDub = mode !== "subtitle";

  if (includeSubtitle) await ensureFont();
  if (includeDub && !state.hasDubAudio) throw new Error("Chua tao giong long tieng. Hay bam 'Tao giong long tieng' truoc.");

  const videoChain = includeSubtitle ? buildVideoFilterChain(true) : "";
  const args = ["-i", state.inputName];
  let filterComplex = "";
  const maps = [];

  if (includeDub) args.push("-i", "dub.wav");

  if (videoChain) {
    filterComplex += `[0:v]${videoChain}[vout];`;
    maps.push("-map", "[vout]");
  } else {
    maps.push("-map", "0:v");
  }

  if (includeDub) {
    filterComplex += `[0:a]volume=${state.voiceSettings.mixVolume}[a0];[1:a]volume=1.0[a1];[a0][a1]amix=inputs=2:duration=first:dropout_transition=2[aout];`;
    maps.push("-map", "[aout]");
  } else {
    maps.push("-map", "0:a?");
  }

  args.push("-filter_complex", filterComplex.replace(/;$/, ""));
  args.push(...maps);
  args.push("-c:v", videoChain ? "libx264" : "copy", "-preset", "ultrafast", "-crf", "26", "-c:a", "aac", "output.mp4");

  log("Lenh FFmpeg: " + args.join(" "));
  await ffmpeg.exec(args);
  const data = await ffmpeg.readFile("output.mp4");
  const blob = new Blob([data.buffer], { type: "video/mp4" });
  state.finalBlobUrl = URL.createObjectURL(blob);
}

// ---------------- subtitle file export (SRT/VTT) ----------------
function buildSrt(segments) {
  const fmt = (t) => {
    const ms = Math.round((t % 1) * 1000);
    const tot = Math.floor(t);
    const s = tot % 60, m = Math.floor(tot / 60) % 60, h = Math.floor(tot / 3600);
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")},${String(ms).padStart(3, "0")}`;
  };
  return segments.map((s, i) => `${i + 1}\n${fmt(s.start)} --> ${fmt(s.end)}\n${wrapText(s.text)}\n`).join("\n");
}
function buildVtt(segments) {
  const fmt = (t) => {
    const ms = Math.round((t % 1) * 1000);
    const tot = Math.floor(t);
    const s = tot % 60, m = Math.floor(tot / 60) % 60, h = Math.floor(tot / 3600);
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(ms).padStart(3, "0")}`;
  };
  const body = segments.map((s) => `${fmt(s.start)} --> ${fmt(s.end)}\n${wrapText(s.text)}\n`).join("\n");
  return `WEBVTT\n\n${body}`;
}
function downloadText(filename, content) {
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

    ]);

    input.addEventListener("change", (e) => e.target.files[0] && handleFileSelected(e.target.files[0]));
    zone.addEventListener("click", () => input.click());
    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("is-dragover"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("is-dragover"));
    zone.addEventListener("drop", (e) => {

      zone.classList.remove("is-dragover");

function addCoverRegion() {
  const vw = state.width || 640, vh = state.height || 360;
  state.coverRegions.push({ x: Math.round(vw * 0.1), y: Math.round(vh * 0.82), w: Math.round(vw * 0.8), h: Math.round(vh * 0.12), style: "box", color: "#000000" });
  renderVideoStage();
}
function removeCoverRegion(idx) {
  state.coverRegions.splice(idx, 1);
  renderVideoStage();
}
function renderCoverRegionEl(r, idx) {
  const box = el("div", {
    class: "cover-region",
    style: `left:${(r.x / (state.width || 1)) * 100}%;top:${(r.y / (state.height || 1)) * 100}%;width:${(r.w / (state.width || 1)) * 100}%;height:${(r.h / (state.height || 1)) * 100}%;background:${r.style === "blur" ? "rgba(20,15,12,0.55)" : r.color + "EA"};`,
  });
  box.appendChild(el("span", { class: "cover-region-label" }, `Vùng che ${idx + 1}`));
  box.appendChild(el("button", { class: "cover-region-remove", onclick: (e) => { e.stopPropagation(); removeCoverRegion(idx); } }, "✕"));
  const handle = el("div", { class: "cover-region-handle" });
  handle.addEventListener("mousedown", (e) => { e.stopPropagation(); e.preventDefault(); startDrag(idx, "resize", e); });
  box.appendChild(handle);
  box.addEventListener("mousedown", (e) => { e.preventDefault(); startDrag(idx, "move", e); });
  return box;
}
function startDrag(index, mode, e) {
  state.dragging = { index, mode, startX: e.clientX, startY: e.clientY, orig: { ...state.coverRegions[index] } };
}
function onStageMouseMove(e) {
  const d = state.dragging;
  if (!d) return;
  const stageEl = document.getElementById("videoStage");
  if (!stageEl) return;
  const rect = stageEl.getBoundingClientRect();
  const scaleX = (state.width || rect.width) / rect.width;
  const scaleY = (state.height || rect.height) / rect.height;
  const dx = (e.clientX - d.startX) * scaleX;
  const dy = (e.clientY - d.startY) * scaleY;
  const r = state.coverRegions[d.index];
  if (!r) return;
  if (d.mode === "move") {
    r.x = Math.max(0, Math.round(d.orig.x + dx));
    r.y = Math.max(0, Math.round(d.orig.y + dy));
  } else {
    r.w = Math.max(20, Math.round(d.orig.w + dx));
    r.h = Math.max(20, Math.round(d.orig.h + dy));
  }
  renderVideoStage();
}
function onStageMouseUp() {
  state.dragging = null;
}

  voiceSel.addEventListener("change", (e) => (vs.voice = e.target.value));
  body.appendChild(el("label", {}, ["Giọng đọc", voiceSel]));

  const speedInput = el("input", { type: "range", min: "0.75", max: "1.5", step: "0.05", value: String(vs.speed) });
  const speedLabel = el("label", {}, [`Tốc độ đọc (${vs.speed.toFixed(2)}x)`, speedInput]);
  speedInput.addEventListener("input", (e) => { vs.speed = Number(e.target.value); speedLabel.firstChild.textContent = `Tốc độ đọc (${vs.speed.toFixed(2)}x)`; });
  body.appendChild(speedLabel);

  const mixInput = el("input", { type: "range", min: "0", max: "1", step: "0.05", value: String(vs.mixVolume) });
  const mixLabel = el("label", {}, [`Âm lượng gốc khi trộn (${Math.round(vs.mixVolume * 100)}%)`, mixInput]);
  mixInput.addEventListener("input", (e) => { vs.mixVolume = Number(e.target.value); mixLabel.firstChild.textContent = `Âm lượng gốc khi trộn (${Math.round(vs.mixVolume * 100)}%)`; });
  body.appendChild(mixLabel);

  panel.appendChild(body);
  panel.appendChild(el("p", { class: "panel-footnote" }, "Giọng đọc lấy từ giọng có sẵn của Gemini TTS — không nhân bản giọng người thật. Tốc độ đọc được áp dụng bằng bộ lọc audio (atempo) sau khi tạo giọng, vì Gemini TTS không có tham số tốc độ trực tiếp."));
  return panel;
}

function renderSettingsPanel() {
  const panel = el("div", { class: "panel" });
  panel.appendChild(el("div", { class: "panel-header" }, [el("h3", {}, "Settings — Gemini API Key")]));
  const body = el("div", { class: "panel-body form-grid" });

  const keyInput = el("input", { type: "password", placeholder: "AIza...", value: state.apiKey });
  keyInput.addEventListener("input", (e) => (state.apiKey = e.target.value.trim()));
  body.appendChild(el("label", { style: "grid-column:1/-1" }, ["Gemini API Key (chỉ lưu tạm trong bộ nhớ trình duyệt)", keyInput]));

  const textModelInput = el("input", { type: "text", value: state.textModel });
  textModelInput.addEventListener("input", (e) => (state.textModel = e.target.value.trim()));
  body.appendChild(el("label", {}, ["Model cho STT + Dịch (text/audio)", textModelInput]));

  const ttsModelInput = el("input", { type: "text", value: state.ttsModel });
  ttsModelInput.addEventListener("input", (e) => (state.ttsModel = e.target.value.trim()));
  body.appendChild(el("label", {}, ["Model TTS (giọng nói)", ttsModelInput]));

  const voiceFemaleInput = el("input", { type: "text", value: state.voiceSettings.voiceNameFemale });
  voiceFemaleInput.addEventListener("input", (e) => (state.voiceSettings.voiceNameFemale = e.target.value.trim()));
  body.appendChild(el("label", {}, ["Tên giọng Nữ (Gemini voice)", voiceFemaleInput]));

  const voiceMaleInput = el("input", { type: "text", value: state.voiceSettings.voiceNameMale });
  voiceMaleInput.addEventListener("input", (e) => (state.voiceSettings.voiceNameMale = e.target.value.trim()));
  body.appendChild(el("label", {}, ["Tên giọng Nam (Gemini voice)", voiceMaleInput]));

  panel.appendChild(body);
  panel.appendChild(
    el(
      "p",
      { class: "panel-footnote" },
      "Key dùng để gọi Gemini (nhận diện lời thoại từ audio, dịch sang tiếng Việt, và tạo giọng nói) trực tiếp từ trình duyệt của bạn tới " +
        "generativelanguage.googleapis.com. Không được ghi vào localStorage — nhưng vì đây là ứng dụng chạy phía trình duyệt (client-side), " +
        "key sẽ xuất hiện trong tab Network của DevTools trên máy bạn; nên dùng key riêng, giới hạn ngân sách. Lấy key tại aistudio.google.com/apikey. " +
        "Tên model và tên giọng nói (voice) có thể đổi theo model/giọng hiện có trong tài khoản Gemini của bạn — xem danh sách tại " +
        "ai.google.dev/gemini-api/docs/speech-generation nếu model mặc định không khả dụng."
    )
  );
  return panel;
}

function renderExportPanelEl() {
  const panel = el("div", { class: "panel panel-export", id: "exportPanel" });
  panel.appendChild(el("div", { class: "panel-header" }, [el("h3", {}, "Export")]));
  const body = el("div", { class: "panel-body" });

  const modes = [
    ["subtitle", "Video + Vietsub"],
    ["dub", "Video + Lồng tiếng"],
    ["subtitle_dub", "Video + Vietsub + Lồng tiếng"],
  ];
  if (!state._exportMode) state._exportMode = "subtitle_dub";
  const modesRow = el("div", { class: "export-modes" });
  modes.forEach(([v, l]) => {
    const chip = el("button", { class: `chip ${state._exportMode === v ? "chip-active" : ""}` }, l);
    chip.addEventListener("click", () => { state._exportMode = v; renderTab(); });
    modesRow.appendChild(chip);
  });
  body.appendChild(modesRow);

  const canRender = state.translation.length > 0;
  const renderBtn = el(
    "button",
    { class: "btn btn-primary btn-block", disabled: !canRender || state.busy ? "true" : null, onclick: () => handleRender(state._exportMode) },
    state.busy ? "Đang xử lý..." : "Export Video"
  );
  body.appendChild(renderBtn);

  const downloads = el("div", { class: "export-downloads" });
  const videoLink = el("a", { class: `btn btn-ghost btn-block ${state.finalBlobUrl ? "" : "btn-disabled"}`, download: "vietdub_output.mp4" }, "⬇ Tải video kết quả");
  if (state.finalBlobUrl) videoLink.href = state.finalBlobUrl;
  downloads.appendChild(videoLink);

  const subRow = el("div", { class: "export-sub-row" });
  const srtBtn = el("a", { class: `btn btn-ghost ${state.translation.length ? "" : "btn-disabled"}` }, "⬇ SRT");
  srtBtn.addEventListener("click", (e) => { e.preventDefault(); downloadText("vietsub.srt", buildSrt(state.translation)); });
  const vttBtn = el("a", { class: `btn btn-ghost ${state.translation.length ? "" : "btn-disabled"}` }, "⬇ VTT");
  vttBtn.addEventListener("click", (e) => { e.preventDefault(); downloadText("vietsub.vtt", buildVtt(state.translation)); });
  subRow.appendChild(srtBtn);
  subRow.appendChild(vttBtn);
  downloads.appendChild(subRow);
  body.appendChild(downloads);

  panel.appendChild(body);
  return panel;
}
function renderExportPanel() {
  if (state.activeTab === "export") renderTab();
  const old = document.getElementById("stepperWrap");
  if (old) old.replaceWith(renderStepperEl());
  renderError();
  renderLog();
}

// ---------------- boot ----------------
renderApp();

</script>
</body>
</html>

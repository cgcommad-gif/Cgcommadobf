<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website tạm đóng cửa</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}
body{display:flex;align-items:center;justify-content:center;background:#07090d;color:#fff;font-family:Arial,Helvetica,sans-serif}
.card{width:min(92%,560px);padding:42px 28px;text-align:center;background:#0f1219;border:1px solid #29313f;border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.55)}
.icon{font-size:52px;margin-bottom:18px}h1{margin:0 0 14px;font-size:28px}
p{margin:0;color:#aeb8c8;line-height:1.7;font-size:15px}
.status{display:inline-block;margin-top:24px;padding:9px 14px;border-radius:999px;background:#1a202b;color:#8f9bad;font-size:13px}
small{display:block;margin-top:22px;color:#697386;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="icon">🔧</div>
<h1>Website đã đóng cửa</h1>
<p>Website hiện đang tạm đóng cửa để tiến hành nâng cấp hệ thống.<br>Vui lòng quay lại sau khi quá trình nâng cấp hoàn tất.</p>
<div class="status">● Đang nâng cấp</div>
<small>Cảm ơn bạn đã thông cảm.</small>
</div>
</body>
</html>
